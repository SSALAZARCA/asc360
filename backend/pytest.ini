[pytest]
asyncio_mode = auto
testpaths = tests
addopts = -m "not lento and not pg_real and not regresion"
markers =
    lento: opt-in, large-volume perf tests (Fase 2 "Ingesta" tier 2). Excluded from the default run (see `addopts`); invoke explicitly with `pytest -m lento` (which overrides `addopts`, since a later `-m` wins over an earlier one).
    pg_real: opt-in, real Postgres 18 tests (need MOTORED_TEST_PG_URL pointing at a database already migrated with `alembic -c alembic_motored.ini upgrade head`). They skip themselves when the variable is not set. Excluded from the default run (see `addopts`); run them with `pytest -m pg_real`.
    regresion: opt-in, levels A/B/C of the Motored F3 regression harness against the reference Excel (need MOTORED_REGRESION_EXCEL pointing at the workbook, which never lives in the repo). They skip themselves when the variable is not set. Excluded from the default run (see `addopts`); run them with `pytest -m regresion`.
